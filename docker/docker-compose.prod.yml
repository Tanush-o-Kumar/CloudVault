version: '3.8'

# ============================================================
# CloudVault Production Stack (EC2 Deployment)
# ============================================================
# Services: PostgreSQL (on-instance) + FastAPI Backend + Nginx proxy
# Frontend is hosted separately on S3 + CloudFront
# Usage: docker compose -f docker/docker-compose.prod.yml up -d --build
# ============================================================

services:

  # ── PostgreSQL Database ─────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cloudvault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudvault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudvault_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cloudvault_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudvault_user} -d ${POSTGRES_DB:-cloudvault_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cloudvault_net

  # ── Alembic Migration Runner (runs once, then exits) ─────
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: cloudvault_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudvault_user}:${POSTGRES_PASSWORD:-cloudvault_pass}@db:5432/${POSTGRES_DB:-cloudvault_db}
      SECRET_KEY: ${SECRET_KEY}
      STORAGE_BACKEND: s3
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    command: ["sh", "-c", "PYTHONPATH=/app alembic -c /app/alembic.ini upgrade head"]
    networks:
      - cloudvault_net

  # ── FastAPI Backend ─────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: cloudvault_backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ../backend/.env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cloudvault_user}:${POSTGRES_PASSWORD:-cloudvault_pass}@db:5432/${POSTGRES_DB:-cloudvault_db}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cloudvault_net

  # ── Nginx Reverse Proxy ─────────────────────────────────
  # Handles: CORS preflight, API proxy, health endpoint
  # Listens on port 80 so CloudFront can reach /api/ directly
  nginx:
    image: nginx:1.27-alpine
    container_name: cloudvault_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cloudvault_net

volumes:
  postgres_data:
    driver: local

networks:
  cloudvault_net:
    driver: bridge
