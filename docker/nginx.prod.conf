# ============================================================
# CloudVault Nginx Production Config (Backend Proxy Only)
# ============================================================
# Frontend is hosted on S3+CloudFront — NOT served by this nginx.
# This nginx only proxies /api/ and /health to the FastAPI backend.
# ============================================================

server {
    listen 80;
    server_name _;   # Accepts any hostname/IP — works with raw EC2 IP

    # ── Security Headers ─────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Health check (for load balancers / monitoring) ─
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── FastAPI API routes ───────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support large file uploads (up to 15MB)
        client_max_body_size 15M;

        # Timeout settings for large file uploads
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # ── Reject everything else ───────────────────────
    location / {
        return 200 '{"service":"CloudVault API","status":"operational"}';
        add_header Content-Type application/json;
    }
}
